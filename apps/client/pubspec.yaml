name: pillxai_client
description: Pillxai Flutter client - interactive tablet GUI preview.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/avatars/
    - assets/images/medicine-a.png
    - assets/images/medicine-b.png
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.otf
