name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feat/v1-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: legacy/v1/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            legacy/v1/server/requirements.txt
            legacy/v1/server/requirements-dev.txt
      - name: Create pill-dispenser environment
        run: python -m venv "$RUNNER_TEMP/pill-dispenser"
      - name: Install test dependencies
        run: '"$RUNNER_TEMP/pill-dispenser/bin/python" -m pip install -r requirements-dev.txt'
      - name: Run isolated V1 tests
        run: '"$RUNNER_TEMP/pill-dispenser/bin/python" -m pytest'

  styles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: legacy/v1/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: legacy/v1/server/package-lock.json
      - run: npm ci
      - name: Build styles with repository-relative content paths
        run: npm run build:css -- --content './templates/**/*.html,./static/js/**/*.js,./node_modules/flowbite/**/*.js'

  hardware:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax without importing hardware tools
        run: python -m compileall -q hardware

  gate:
    if: always()
    needs:
      - server
      - styles
      - hardware
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI
        env:
          SERVER_RESULT: ${{ needs.server.result }}
          STYLES_RESULT: ${{ needs.styles.result }}
          HARDWARE_RESULT: ${{ needs.hardware.result }}
        run: |
          for result in "$SERVER_RESULT" "$STYLES_RESULT" "$HARDWARE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done
